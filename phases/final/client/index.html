<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>More Firepower</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #eee; font-family: monospace; overflow: hidden; }
    #hud {
      position: fixed; top: 8px; left: 8px; z-index: 10;
      background: rgba(0,0,0,0.7); padding: 6px 10px; border-radius: 4px;
      font-size: 13px; line-height: 1.6;
    }
    #canvas { display: block; }
  </style>
</head>
<body>
  <div id="hud">
    <div>Tick: <span id="hud-tick">—</span></div>
    <div>Team A: <span id="hud-score-a">0</span> | Team B: <span id="hud-score-b">0</span></div>
    <div>Status: <span id="hud-status">connecting…</span></div>
  </div>
  <canvas id="canvas"></canvas>
  <script type="module" src="js/client.js"></script>
</body>
</html>
