<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>More Firepower</title>
    <style>
        body { margin: 0; padding: 0; background: #111; color: #eee; font-family: sans-serif; overflow: hidden; touch-action: none; }
        #canvas-container { position: absolute; width: 100%; height: 100%; }
        #hud-top { position: absolute; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
        .hud-group { pointer-events: auto; }
        .btn { background: #333; border: 1px solid #555; color: white; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 14px; }
        .btn:active { background: #555; }
        .btn.team-a { border-color: #4a4; }
        .btn.team-b { border-color: #a44; }
        #status-bar { position: absolute; bottom: 10px; left: 10px; font-size: 12px; color: #888; }
        #supply-bar { position: absolute; bottom: 10px; right: 10px; font-size: 13px; color: #cdc; }
        #join-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 10; }
        #join-overlay h1 { margin: 0; font-weight: 600; letter-spacing: 2px; }
        #join-overlay p { color: #999; max-width: 420px; text-align: center; }
        #event-feed { position: absolute; top: 48px; left: 10px; font-size: 12px; color: #9ab; pointer-events: none; max-width: 40%; }
        #event-feed div { margin-bottom: 2px; text-shadow: 0 1px 2px #000; }
    </style>
</head>
<body>
    <div id="join-overlay">
        <h1>MORE FIREPOWER</h1>
        <p>An active war is running. Pick a side and take command of an asset.
           Click ground to move, click a visible enemy to fire.
           Return to base to resupply.</p>
        <div>
            <button class="btn team-a" id="btn-join-a">Join Team A (green, west)</button>
            <button class="btn team-b" id="btn-join-b">Join Team B (red, east)</button>
        </div>
    </div>
    <div id="hud-top">
        <div class="hud-group" id="op-info">Not joined</div>
        <div class="hud-group">
            <button class="btn" id="btn-next-asset">Next asset</button>
            <button class="btn" id="btn-recenter">Center</button>
        </div>
    </div>
    <div id="event-feed"></div>
    <div id="status-bar">Waiting for snapshot...</div>
    <div id="supply-bar"></div>
    <div id="canvas-container"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "/vendor/three/build/three.module.js"
        }
    }
    </script>
    <script type="module" src="./js/client.js"></script>
</body>
</html>
